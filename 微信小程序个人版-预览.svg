<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8492c1"/>
      <stop offset="1" stop-color="#aab4d7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1f2d23" flood-opacity=".13"/>
    </filter>
    <style>
      .bg{fill:#fbfaf6}
      .phone{fill:#fffefa;stroke:#e2e3dc;stroke-width:2;filter:url(#shadow)}
      .card{fill:#fffefa;stroke:#e0e1da;stroke-width:1.5}
      .soft{fill:#f4f5fb}
      .title{font:800 27px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#16241d}
      .h2{font:800 22px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#16241d}
      .txt{font:500 15px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#667068}
      .small{font:500 13px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#707871}
      .white{fill:white}
      .mutew{fill:rgba(255,255,255,.82)}
      .num{font:800 44px Georgia,serif;fill:#6573a4}
      .heroNum{font:800 64px Georgia,serif;fill:white}
      .pill{fill:#eef0ff}
      .pillText{font:700 13px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#6674a6}
      .btn{fill:#f4f5fb;stroke:#e0e1da;stroke-width:1}
      .btnText{font:700 14px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#6674a6}
      .blue{stroke:#7fa4d8}
      .green{stroke:#79b99a}
      .orange{stroke:#e7ae76}
      .purple{stroke:#9a8bc5}
      .red{stroke:#e58d91}
    </style>
  </defs>
  <rect class="bg" width="1280" height="820"/>
  <text x="170" y="58" class="title">M1 总览｜个人版</text>
  <text x="790" y="58" class="title">M4 错题复盘｜拍照 + 遗忘曲线</text>

  <!-- Dashboard phone -->
  <rect x="100" y="82" width="430" height="700" rx="36" class="phone"/>
  <rect x="126" y="110" width="378" height="118" rx="26" fill="url(#hero)"/>
  <text x="150" y="142" class="small white">个人版 · 国考主线</text>
  <text x="150" y="176" class="h2 white">今天也向目标靠近一点</text>
  <text x="150" y="204" class="small white">2026-11-25 笔试 · 江苏 · 目标 145 分</text>
  <text x="428" y="143" class="small white" text-anchor="middle">倒计时</text>
  <text x="428" y="196" class="heroNum" text-anchor="middle">122</text>
  <text x="428" y="216" class="small white" text-anchor="middle">天</text>

  <rect x="126" y="244" width="181" height="102" rx="20" class="card"/>
  <text x="146" y="274" class="small">今日完成</text>
  <text x="146" y="320" class="num">50%</text>
  <rect x="146" y="330" width="132" height="8" rx="4" fill="#e7e8e1"/>
  <rect x="146" y="330" width="66" height="8" rx="4" fill="#96a1c7"/>
  <rect x="323" y="244" width="181" height="102" rx="20" class="card"/>
  <text x="343" y="274" class="small">今日用时</text>
  <text x="343" y="320" class="num">45</text>
  <text x="410" y="318" class="txt">/ 90 分钟</text>

  <rect x="126" y="362" width="378" height="188" rx="22" class="card"/>
  <text x="150" y="397" class="h2">五大模块今日目标</text>
  <text x="150" y="421" class="txt">题量 · 正确率 · 完成时间</text>
  <g transform="translate(150 446)">
    <rect width="92" height="82" rx="18" fill="#fff" class="blue"/>
    <text x="46" y="27" class="pillText" text-anchor="middle" fill="#16241d">资料分析</text>
    <text x="46" y="51" class="small" text-anchor="middle">20题 · 85%</text>
    <text x="46" y="70" class="small" text-anchor="middle">≤25分钟</text>
  </g>
  <g transform="translate(254 446)">
    <rect width="92" height="82" rx="18" fill="#fff" class="green"/>
    <text x="46" y="27" class="pillText" text-anchor="middle" fill="#16241d">言语理解</text>
    <text x="46" y="51" class="small" text-anchor="middle">40题 · 80%</text>
    <text x="46" y="70" class="small" text-anchor="middle">≤35分钟</text>
  </g>
  <g transform="translate(358 446)">
    <rect width="92" height="82" rx="18" fill="#fff" class="orange"/>
    <text x="46" y="27" class="pillText" text-anchor="middle" fill="#16241d">政治理论</text>
    <text x="46" y="51" class="small" text-anchor="middle">20题 · 80%</text>
    <text x="46" y="70" class="small" text-anchor="middle">≤15分钟</text>
  </g>

  <rect x="126" y="566" width="378" height="140" rx="22" class="card"/>
  <text x="150" y="600" class="h2">今日到期复盘</text>
  <text x="150" y="624" class="txt">按遗忘曲线安排，完成后进入下一轮</text>
  <rect x="150" y="646" width="330" height="38" rx="16" fill="#fff" stroke="#e0e1da"/>
  <text x="166" y="670" class="txt">资料分析错题 · 增长率比较 · 第 2 / 6 轮</text>

  <rect x="126" y="725" width="378" height="42" fill="#fffefa"/>
  <circle cx="164" cy="746" r="5" fill="#7d89b5"/><text x="190" y="751" class="small">总览</text>
  <circle cx="258" cy="746" r="5" fill="#c3c7d8"/><text x="284" y="751" class="small">计划</text>
  <circle cx="352" cy="746" r="5" fill="#c3c7d8"/><text x="378" y="751" class="small">复盘</text>

  <!-- Review phone -->
  <rect x="720" y="82" width="430" height="700" rx="36" class="phone"/>
  <text x="750" y="133" class="title">错题复盘</text>
  <text x="750" y="160" class="txt">拍照留索引，按遗忘曲线自动安排复盘</text>

  <rect x="750" y="182" width="175" height="92" rx="20" class="card"/>
  <text x="772" y="212" class="small">今日到期</text>
  <text x="772" y="258" class="num">2</text>
  <rect x="945" y="182" width="175" height="92" rx="20" class="card"/>
  <text x="967" y="212" class="small">已掌握</text>
  <text x="967" y="258" class="num">8</text>

  <rect x="750" y="292" width="370" height="250" rx="22" class="card"/>
  <text x="774" y="326" class="h2">添加错题</text>
  <text x="774" y="350" class="txt">支持拍照/上传，OCR 后续接入</text>
  <rect x="976" y="310" width="116" height="38" rx="16" class="btn"/>
  <text x="1034" y="334" class="btnText" text-anchor="middle">拍照/上传</text>
  <rect x="774" y="372" width="322" height="54" rx="16" fill="#f4f5fb"/>
  <text x="794" y="405" class="txt">题目摘要：增长率比较错题</text>
  <rect x="774" y="438" width="150" height="54" rx="16" fill="#fff"/>
  <text x="794" y="471" class="txt">资料分析</text>
  <rect x="942" y="438" width="154" height="54" rx="16" fill="#fff"/>
  <text x="962" y="471" class="txt">知识盲点</text>
  <rect x="774" y="504" width="322" height="24" rx="12" fill="#7d89b5"/>
  <text x="935" y="521" class="small white" text-anchor="middle">保存并生成复盘计划</text>

  <rect x="750" y="560" width="370" height="116" rx="22" class="card"/>
  <text x="774" y="594" class="h2">今日到期复盘</text>
  <rect x="774" y="610" width="72" height="52" rx="14" fill="#eef0ff"/>
  <text x="860" y="632" class="txt">增长率比较错题</text>
  <text x="860" y="654" class="small">资料分析 · 第 2 / 6 轮</text>
  <rect x="1034" y="620" width="62" height="34" rx="14" class="btn"/>
  <text x="1065" y="642" class="btnText" text-anchor="middle">完成</text>

  <rect x="750" y="692" width="370" height="62" rx="22" class="card"/>
  <text x="774" y="727" class="h2">未来复盘</text>
  <text x="982" y="727" class="pillText">0 / 1 / 3 / 7 / 15 / 30 天</text>
</svg>
