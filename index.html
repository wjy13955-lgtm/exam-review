<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173f2d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="上岸轨迹">
  <meta name="description" content="公考备考目标、计划、练习、错题与模考管理工具">
  <title>上岸轨迹｜公考备考驾驶舱</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./wechat-miniprogram-personal/assets/tabbar/plan-active.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#dashboard"><b>岸</b><span><strong>上岸轨迹</strong><small>备考驾驶舱</small></span></a>
      <nav id="side-nav"></nav>
      <div class="side-foot"><span>数据仅保存在本机</span><button data-action="export">导出备份 →</button></div>
    </aside>
    <main>
      <header class="topbar">
        <div><p id="date-label"></p><h1 id="page-title">总览</h1></div>
        <div class="top-actions"><span class="saved">● 已保存到本机</span><button class="btn outline" data-action="practice">＋ 记录练习</button></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>
  <nav id="mobile-nav" class="mobile-nav"></nav>
  <div id="modal-root"></div>
  <div id="install-prompt" class="install-prompt" hidden>
    <div><b>安装“上岸轨迹”</b><span>放到手机桌面，打开更方便，也可离线使用。</span></div>
    <button class="btn small" data-action="install-app">安装</button>
    <button class="install-close" data-action="dismiss-install" aria-label="暂不安装">×</button>
  </div>
  <input id="import-file" type="file" accept="application/json" hidden>
  <div id="toast" class="toast"></div>
  <script src="./app.js"></script>
</body>
</html>
